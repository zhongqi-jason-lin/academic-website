<title>Page not found — Jane Q. Example</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="assets/favicon-192.png" type="image/png" sizes="192x192">
<link rel="preload" href="assets/fonts/newsreader-normal-core.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/newsreader-italic-core.woff2" as="font" type="font/woff2" crossorigin>
<!-- The page shown for an address the site doesn't have, on the homepage's notebook paper: its colours, graph grid,
     margin rule, texture and wavy divider, in light and dark (the OS setting, or the homepage's theme switch while it
     holds a choice). GitHub Pages serves a 404.html at the site's root by itself; on Cloudflare, wrangler.jsonc's
     not_found_handling does. Like index.html's, its paths are relative to the page, so they hold for a missing
     address in the site's own folder (/old-page, or /repo/old-page on a GitHub Pages project site). A change to the
     homepage's palette or fonts belongs here too. -->
<script>
  // the homepage's saved theme (its switch keeps a choice only while it differs from the OS). Both theme-color metas
  // take the shown theme's color, so the browser's toolbar matches the page whichever meta it reads (as on the homepage)
  (function(){try{var t=null,os=matchMedia('(prefers-color-scheme: dark)').matches;
    try{t=localStorage.getItem('theme')}catch(e){}
    if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else t=os?'dark':'light';
    var m=document.querySelectorAll('meta[name="theme-color"][media]'),c,i;
    for(i=0;i<m.length;i++)if(m[i].getAttribute('media').indexOf(t)>=0)c=m[i].content;
    if(c)for(i=0;i<m.length;i++)m[i].content=c}catch(e){}})();
</script>
<style>
/* the homepage's fonts: the core subsets (fonts.css, subset_fonts.py) cover this page's text; the full latin files only other characters */
@font-face{font-family:'Newsreader';font-style:normal;font-weight:300 700;font-display:swap;src:url(assets/fonts/newsreader-normal-latin.woff2) format('woff2');unicode-range:U+0000-001F,U+007F-009F,U+00A1-00A8,U+00AA-00B6,U+00B8-00D6,U+00D8-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-2012,U+2015-2017,U+201A-201B,U+201E-2025,U+2027-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Newsreader';font-style:italic;font-weight:300 700;font-display:swap;src:url(assets/fonts/newsreader-italic-latin.woff2) format('woff2');unicode-range:U+0000-001F,U+007F-009F,U+00A1-00A8,U+00AA-00B6,U+00B8-00D6,U+00D8-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-2012,U+2015-2017,U+201A-201B,U+201E-2025,U+2027-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Newsreader';font-style:normal;font-weight:300 700;font-display:swap;src:url(assets/fonts/newsreader-normal-core.woff2) format('woff2');unicode-range:U+0020-007E,U+00A0,U+00A9,U+00B7,U+00D7,U+2013,U+2014,U+2018,U+2019,U+201C,U+201D,U+2026}
@font-face{font-family:'Newsreader';font-style:italic;font-weight:300 700;font-display:swap;src:url(assets/fonts/newsreader-italic-core.woff2) format('woff2');unicode-range:U+0020-007E,U+00A0,U+00A9,U+00B7,U+00D7,U+2013,U+2014,U+2018,U+2019,U+201C,U+201D,U+2026}
:root{--bg:#F9F6EF;--text:#1F2533;--text2:#3B4150;--muted:#5A5F6B;--accent:#0063c4;--accent-faint:rgba(0,99,196,.16);
  --marg:rgba(0,99,196,.32);--gridc:rgba(0,99,196,.075);--tex-o:1;--tex-mot:#9a7640;--tex-ink:#5c4424;color-scheme:light}
/* dark on screens only: printed (or saved as PDF), the page keeps the light palette, dark text on white paper, as the
   homepage does (2026-10-13; the dark page's light text printed grey, 2.9:1) */
@media screen and (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--text:#EFE8DC;--text2:#D9D1C3;--muted:#B3AB9D;
  --accent:#34c0db;--accent-faint:rgba(52,192,219,.16);--marg:rgba(52,192,219,.3);--gridc:rgba(160,210,225,.055);--tex-o:.5;--tex-mot:#000;--tex-ink:#f3e6cc;color-scheme:dark}}
@media screen{:root[data-theme="dark"]{--bg:#171614;--text:#EFE8DC;--text2:#D9D1C3;--muted:#B3AB9D;--accent:#34c0db;--accent-faint:rgba(52,192,219,.16);
  --marg:rgba(52,192,219,.3);--gridc:rgba(160,210,225,.055);--tex-o:.5;--tex-mot:#000;--tex-ink:#f3e6cc;color-scheme:dark}}
/* the accent's oklch upgrade, as on the homepage (the hex above is its fallback). The light rule can't override the
   dark ones above (they are more specific), and the dark ones come after them; like them, dark is for screens only */
@supports (color: oklch(0% 0 0)){:root{--accent:oklch(0.50 0.18 252)}
  @media screen and (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:oklch(0.72 0.12 205)}}
  @media screen{:root[data-theme="dark"]{--accent:oklch(0.72 0.12 205)}}}
html{background-color:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;position:relative;background-color:var(--bg);color:var(--text);
  font:400 17px/1.5 'Newsreader',Georgia,serif;display:grid;place-items:center;-webkit-text-size-adjust:100%}
/* the paper: graph grid with a line under the margin rule, the texture tiles, and the margin rule */
.paper{position:absolute;inset:0;z-index:0;pointer-events:none;background-size:24px 24px;background-position:-1px 11px;
  background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px)}
.paper > div{position:absolute;inset:0;opacity:var(--tex-o)}
.paper i{position:absolute;inset:0;display:block;-webkit-mask-repeat:repeat;mask-repeat:repeat}
.paper .pm{background-image:linear-gradient(var(--tex-mot),var(--tex-mot));-webkit-mask-image:url(assets/tex-mottle.webp);mask-image:url(assets/tex-mottle.webp);-webkit-mask-size:1024px 1024px;mask-size:1024px 1024px}
.paper .pt{background-image:linear-gradient(var(--tex-ink),var(--tex-ink));-webkit-mask-image:url(assets/tex-tooth.webp);mask-image:url(assets/tex-tooth.webp);-webkit-mask-size:256px 256px;mask-size:256px 256px}
/* the window's top edge stays plain paper, as on the homepage: Dia colours its toolbar from the top of the page, and the
   grain's specks there turned it cream over the dark page */
.edge{position:fixed;left:0;right:0;top:0;height:24px;z-index:0;pointer-events:none;background-image:linear-gradient(var(--bg) 12px,transparent)}
/* phone -> desktop, as on the homepage (responsive/notebook.css, "tablet + phone"): --ab is 0 in windows up to 660px
   and 80px from 740px, so the margin rule, the paddings and the type glide from their phone values to their desktop
   ones across those 80px instead of switching at 700px */
:root{--ab:clamp(0px,100vw - 660px,80px)}
/* the margin rule: a 4px box with its two lines 2px apart (border-box, as everything on the homepage), 10 -> 47px */
.margin{position:absolute;top:0;bottom:0;left:calc(10px + var(--ab) * .4625);width:4px;box-sizing:border-box;z-index:0;pointer-events:none;
  border-left:1px solid var(--marg);border-right:1px solid var(--marg);opacity:.75}
main{position:relative;z-index:1;box-sizing:border-box;width:100%;max-width:640px;text-align:center;
  padding:calc(40px + var(--ab) * .1) calc(16px + var(--ab) * .3) calc(40px + var(--ab) * .1) calc(28px + var(--ab) * .55)}   /* 40 16 40 28 -> 48 40 48 72px */
.kicker{margin:0 0 14px;font-size:12px;line-height:1;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
/* the heading may break inside a word (overflow-wrap:anywhere): with text enlarged 1.5x or more on its own (a text-only
   zoom; the heading is set in px, so a browser's default font size doesn't enlarge it) on a phone, the bound "the
   notebook." is wider than the column, and body's grid track grew to fit it, so the page scrolled sideways with the
   heading and subtitle past the window's edge. At 100% it always fits, so nothing changes */
h1{margin:0;font-weight:400;font-size:calc(32px + var(--ab) * .1);line-height:1.12;letter-spacing:-.01em;color:var(--text);overflow-wrap:anywhere}   /* 32 -> 40px */
.sub{margin:14px 0 0;font-style:italic;font-size:calc(19px + var(--ab) * .025);line-height:1.35;color:var(--text2)}   /* 19 -> 21px */
.pen{display:block;margin:26px auto 22px}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 28px}
nav a{position:relative;display:inline-flex;align-items:center;min-height:24px;font-size:16px;color:var(--accent);
  text-decoration:underline;text-decoration-color:var(--accent-faint);text-underline-offset:4px}
nav a::before{content:"";position:absolute;inset:-10px -8px}   /* a 44px tap area around the word */
nav a:hover,nav a:focus-visible{text-decoration-color:var(--accent)}   /* keyboard focus shows the hover's underline too */
/* more contrast asked for (e.g. macOS "Increase contrast"): the links are underlined in their own colour, as the
   homepage's "Read the paper" is then (--accent-faint stays: it is also the selection's tint), and a hover or keyboard
   focus thickens the underline, since its colour has nowhere left to go (2026-10-13) */
@media (prefers-contrast:more){ nav a{text-decoration-color:currentColor} nav a:hover,nav a:focus-visible{text-decoration-thickness:2px} }
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
::selection{background:var(--accent-faint);color:var(--text)}
</style>
</head>
<body>
<div class="paper" aria-hidden="true"><div><i class="pm"></i><i class="pt"></i></div></div>
<div class="edge" aria-hidden="true"></div>
<div class="margin" aria-hidden="true"></div>
<main>
  <p class="kicker">Page not found</p>
  <h1>This page isn’t in the&nbsp;notebook.</h1>
  <p class="sub">The link may be old or mistyped.</p>
  <svg class="pen" viewBox="0 0 150 12" width="150" height="12" aria-hidden="true"><path d="M2 7.2C12 3.1 21 10.4 33 6.6S55 3.2 67 6.9S90 10.2 102 5.9S126 3.6 138 6.8C142 7.9 145 7.6 148 6.1" style="fill:none;stroke:var(--accent);stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round"/></svg>
  <nav aria-label="Where to go">
    <a href="./">Go to the homepage</a>
    <a href="assets/your-cv.pdf" target="_blank" rel="noopener" aria-describedby="cv-note">Open the CV</a>
  </nav>
  <!-- what screen readers hear after the CV link's name, as on the homepage -->
  <span id="cv-note" hidden>PDF, opens in a new tab</span>
</main>
</body>
</html>
